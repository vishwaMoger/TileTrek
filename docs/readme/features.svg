ffffff">ROUTE TRAIL</text><text x="740.0" y="180" text-anchor="middle" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#aab4d4">Glowing beads show the path: gold</text><text x="740.0" y="197" text-anchor="middle" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#aab4d4">to the trophy, red to danger</text><path d="M38.0,248 H296.0 V384 L282.0,398 H24.0 V262 Z" fill="#0e1430" fill-opacity=".85" stroke="#FFD93D" stroke-opacity=".35" stroke-width="1.5"/><path d="M38.0,248 H296.0 V384 L282.0,398 H24.0 V262 Z" fill="none" stroke="url(#accu3)" stroke-width="2.5" pathLength="100" stroke-dasharray="14 86" filter="url(#glowu3)"><animate attributeName="stroke-dashoffset" values="100;0" dur="4s" begin="1.35s" repeatCount="indefinite"/></path><rect x="250.0" y="388" width="30" height="3" fill="#4D96FF" opacity=".7"/><text x="160.0" y="292" text-anchor="middle" font-size="30">🏆</text><text x="160.0" y="324" text-anchor="middle" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="800" letter-spacing="1.5" fill="#ffffff">30 LEVELS</text><text x="160.0" y="348" text-anchor="middle" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#aab4d4">Hand-picked from generated boards</text><text x="160.0" y="365" text-anchor="middle" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#aab4d4">on a rising difficulty curve</text><path d="M328.0,248 H586.0 V384 L572.0,398 H314.0 V262 Z" fill="#0e1430" fill-opacity=".85" stroke="#FFD93D" stroke-opacity=".35" stroke-width="1.5"/><path d="M328.0,248 H586.0 V384 L572.0,398 H314.0 V262 Z" fill="none" stroke="url(#accu3)" stroke-width="2.5" pathLength="100" stroke-dasharray="14 86" filter="url(#glowu3)"><animate attributeName="stroke-dashoffset" values="100;0" dur="4s" begin="1.80s" repeatCount="indefinite"/></path><rect x="540.0" y="388" width="30" h